name: build-opensrc

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: ????
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install ldid xz libarchive || true

      - name: ?? Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK: $SDK ($VER)"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: ?????
        run: bash ci_fetch_deps.sh

      - name: ???? A(BaseBin + 9 ? exploit)
        continue-on-error: true
        run: bash tools/build_channel_a.sh

      - name: ???????
        continue-on-error: true
        run: make -C src deps

      - name: ??
        run: |
          make -C src clean || true
          make -C src -j"$(sysctl -n hw.ncpu)" package

      - name: ??? A ???? app
        continue-on-error: true
        run: make -C src exploits

      - name: ? IPA
        run: |
          make -C src ipa
          ls -lh src/OPENsrc.ipa

      - name: ????
        uses: actions/upload-artifact@v4
        with:
          name: OPENsrc-ipa
          path: src/OPENsrc.ipa
          if-no-files-found: error
