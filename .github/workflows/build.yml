name: build-opensrc

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install ldid xz libarchive || true

      - name: 安装 Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK: $SDK ($VER)"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: 拉上游源码
        run: bash ci_fetch_deps.sh

      - name: 构建通道 A（BaseBin + 9 个 exploit）
        continue-on-error: true
        run: bash tools/build_channel_a.sh

      - name: 构建内核静态库
        continue-on-error: true
        run: make -C src deps

      - name: 编译
        run: |
          make -C src clean || true
          make -C src -j"$(sysctl -n hw.ncpu)" package

      - name: 把通道 A 产物装进 app
        continue-on-error: true
        run: make -C src exploits

      - name: 出 IPA
        run: |
          make -C src ipa
          ls -lh src/OPENsrc.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OPENsrc-ipa
          path: src/OPENsrc.ipa
          if-no-files-found: error
